name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }} / Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.0.0"
            release-gates: false
          - os: macos-latest
            node: "22.0.0"
            release-gates: false
          - os: windows-latest
            node: "22.0.0"
            release-gates: false
          - os: ubuntu-latest
            node: "24"
            release-gates: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm run check

      - name: Build
        run: npm run build

      - name: Build, inspect, install, and smoke-test the package
        run: npm run check:package

      - name: Release-only metadata, migration, UI, PTY, and audit gates
        if: matrix.release-gates
        run: |
          ORCODE_PACKAGE_VERSION=$(node -p "require('./package.json').version")
          npm run check:release -- --tag "v${ORCODE_PACKAGE_VERSION}"
          npm run test:migration
          npm run test:release-regressions
          npm run test:pty
          npm audit --omit=dev --audit-level=high
          git diff --check
          git diff --exit-code
