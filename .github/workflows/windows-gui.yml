name: Windows GUI foundation

on:
  push:
    branches: [codex/orcode-workbench-2026-10-12]
    paths:
      - '.github/workflows/windows-gui.yml'
      - 'gui/**'
      - 'scripts/gui*.mjs'
      - 'src/native-*.ts'
      - 'tests/native-*.test.ts'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Native Windows compilation (not desktop acceptance)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm
      - name: Build Core and frontend
        run: |
          npm ci
          npm --prefix gui ci
          npm run build
          npm --prefix gui run build
      - name: Check native shell and test compilation
        run: |
          cargo --version
          cargo check --manifest-path gui/src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc --tests
      - name: Run shared native contracts and fail-closed Windows tests
        run: cargo test --manifest-path gui/src-tauri/Cargo.toml --locked --lib --test engine_lifecycle --test windows_native
      - name: Run native protocol contracts
        run: node --import tsx --test tests/native-owner-bootstrap.test.ts tests/native-platform-protocol.test.ts tests/native-sidecar-channel.test.ts tests/native-shell-action.test.ts tests/official-cli-native-action.test.ts
