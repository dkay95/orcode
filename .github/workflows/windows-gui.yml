name: Windows GUI foundation

on:
  push:
    branches: [codex/orcode-workbench-2026-10-12]
    paths:
      - '.github/workflows/windows-gui.yml'
      - 'gui/**'
      - 'scripts/gui*.mjs'
      - 'scripts/gui*.json'
      - 'src/native-*.ts'
      - 'tests/native-*.test.ts'
      - 'tests/gui-windows-package.test.ts'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Native Windows compilation (not desktop acceptance)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm
      - name: Record native compiler cache identity
        id: rust
        run: '"version=$((rustc --version).Replace('' '', ''-''))" >> $env:GITHUB_OUTPUT'
      - name: Bind the account-free fixture runtime
        run: '"ORCODE_TEST_NODE=$(node -p ''process.execPath'')" >> $env:GITHUB_ENV'
      - uses: actions/cache/restore@v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            gui/src-tauri/target
          key: windows-native-v1-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('gui/src-tauri/Cargo.lock') }}
      - name: Build Core and frontend
        run: |
          npm ci
          npm --prefix gui ci
          npm run build
          npm --prefix gui run build
      - name: Check native shell and test compilation
        run: |
          cargo --version
          cargo check --manifest-path gui/src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc --tests
      - name: Run shared native contracts and fail-closed Windows tests
        run: cargo test --manifest-path gui/src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc --no-fail-fast --lib --test engine_lifecycle --test native_owner_contract --test windows_native --test windows_image
      - name: Run native protocol contracts
        run: node --import tsx --test tests/native-owner-bootstrap.test.ts tests/native-platform-protocol.test.ts tests/native-sidecar-channel.test.ts tests/native-shell-action.test.ts tests/official-cli-native-action.test.ts tests/gui-windows-package.test.ts
      - uses: actions/cache/save@v5
        if: always() && !cancelled() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            gui/src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
